<style>

/* =========================================================
   ASTRA VISTA — LOGIN
   Theme: #173F9F + #7357E8
========================================================= */


/* =========================================================
   ROOT
========================================================= */

:root{

    --primary:#173F9F;
    --primary-dark:#102F78;
    --primary-soft:rgba(23,63,159,.10);

    --secondary:#7357E8;
    --secondary-soft:rgba(115,87,232,.12);

    --bg:#F7F9FF;
    --surface:#FFFFFF;
    --surface-soft:#F5F7FD;

    --text:#171A2A;
    --text-soft:#73788B;

    --border:#E3E7F1;

    --shadow:
        0 35px 90px rgba(31,45,95,.15),
        0 10px 30px rgba(31,45,95,.07);

    --radius:30px;

    --transition:.3s ease;
}


/* =========================================================
   DARK MODE
========================================================= */

html.dark{

    --bg:#070A14;
    --surface:#101526;
    --surface-soft:#151B2D;

    --text:#F4F6FF;
    --text-soft:#A8AFC2;

    --border:#283047;

    --primary-soft:rgba(23,63,159,.18);
    --secondary-soft:rgba(115,87,232,.18);

    --shadow:
        0 35px 90px rgba(0,0,0,.50),
        0 10px 35px rgba(0,0,0,.30);
}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;
}

body{

    font-family:"DM Sans",sans-serif;

    background:var(--bg);

    color:var(--text);
}


/* =========================================================
   MAIN AUTH AREA
========================================================= */

.auth-page{

    width:100%;
    height:100svh;

    min-height:100%;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:30px;

    overflow:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.auth-bg{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.auth-bg::before{

    content:"";

    position:absolute;

    width:700px;
    height:720px;

    top:-320px;
    left:-250px;

    background:
        radial-gradient(
            circle,
            rgba(23,63,159,.18),
            transparent 68%
        );

    filter:blur(10px);
}

.auth-bg::after{

    content:"";

    position:absolute;

    width:650px;
    height:650px;

    right:-260px;
    bottom:-300px;

    background:
        radial-gradient(
            circle,
            rgba(115,87,232,.17),
            transparent 68%
        );

    filter:blur(10px);
}


/* =========================================================
   COSMIC GLOW
========================================================= */

.auth-bg{

    background:

        radial-gradient(
            circle at 78% 25%,
            rgba(115,87,232,.07),
            transparent 25%
        ),

        radial-gradient(
            circle at 20% 75%,
            rgba(23,63,159,.07),
            transparent 25%
        );
}


/* =========================================================
   DECORATIVE ORBS
========================================================= */

.orb{

    position:absolute;

    border-radius:50%;

    pointer-events:none;

    opacity:.55;
}

.orb-one{

    width:90px;
    height:90px;

    top:13%;
    right:13%;

    background:
        rgba(23,63,159,.08);

    border:
        1px solid rgba(23,63,159,.08);

    animation:
        floatOne 8s ease-in-out infinite;
}

.orb-two{

    width:55px;
    height:55px;

    bottom:14%;
    left:12%;

    background:
        rgba(115,87,232,.10);

    border:
        1px solid rgba(115,87,232,.08);

    animation:
        floatTwo 7s ease-in-out infinite;
}


@keyframes floatOne{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-18px);
    }
}


@keyframes floatTwo{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(16px);
    }
}


/* =========================================================
   TOP CONTROLS
========================================================= */

.top-controls{

    position:absolute;

    top:24px;
    right:28px;

    display:flex;

    align-items:center;

    gap:10px;

    z-index:20;
}


.control-btn{

    width:42px;
    height:42px;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:
        rgba(255,255,255,.72);

    backdrop-filter:blur(12px);

    color:var(--text);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:17px;

    transition:var(--transition);
}


html.dark .control-btn{

    background:
        rgba(16,21,38,.85);
}


.control-btn:hover{

    transform:translateY(-2px);

    border-color:
        var(--secondary);

    color:
        var(--secondary);
}


/* =========================================================
   LOGIN CARD
========================================================= */

.login-card{

    position:relative;

    z-index:5;

    width:min(100%,500px);

    min-height:720px;

    padding:42px 48px 40px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(249,250,255,.97)
        );

    border:
        1px solid rgba(255,255,255,.85);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    backdrop-filter:blur(22px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    overflow:hidden;

    animation:
        cardReveal .7s ease both;
}


@keyframes cardReveal{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


html.dark .login-card{

    background:
        linear-gradient(
            145deg,
            rgba(16,21,38,.98),
            rgba(11,16,30,.98)
        );

    border-color:
        rgba(255,255,255,.06);
}


/* =========================================================
   CARD TOP GLOW
========================================================= */

.login-card::before{

    content:"";

    position:absolute;

    width:240px;
    height:240px;

    top:-130px;
    right:-100px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(115,87,232,.15),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    text-decoration:none;

    color:inherit;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    margin-bottom:30px;
}


.logo-box{

    width:68px;
    height:68px;

    flex-shrink:0;

    border-radius:19px;

    overflow:hidden;

    background:
        var(--surface-soft);

    border:
        1px solid var(--border);

    box-shadow:
        0 12px 25px rgba(23,63,159,.13);

    display:flex;

    align-items:center;
    justify-content:center;
}


.logo-box img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    padding:5px;
}


.brand-text{

    display:flex;

    flex-direction:column;

    gap:4px;
}


.brand-name{

    font-family:
        "Playfair Display",
        serif;

    font-size:28px;

    line-height:1.1;

    font-weight:600;

    letter-spacing:-.6px;
}


.brand-primary{

    color:
        var(--primary);
}


.brand-secondary{

    color:
        var(--secondary);
}


.brand-tag{

    font-size:9px;

    color:
        var(--secondary);

    letter-spacing:2px;

    text-transform:uppercase;

    font-weight:700;
}


/* =========================================================
   INTRO
========================================================= */

.login-intro{

    text-align:center;

    margin-bottom:28px;
}


.login-intro .eyebrow{

    display:inline-flex;

    align-items:center;

    gap:8px;

    color:
        var(--primary);

    font-size:10px;

    font-weight:700;

    letter-spacing:1.7px;

    text-transform:uppercase;

    margin-bottom:9px;
}


.eyebrow-line{

    width:22px;

    height:1px;

    background:
        var(--secondary);
}


.login-intro h1{

    font-family:
        "Playfair Display",
        serif;

    font-size:35px;

    line-height:1.15;

    font-weight:600;

    letter-spacing:-.7px;

    margin-bottom:9px;
}


.login-intro p{

    color:
        var(--text-soft);

    font-size:13px;

    line-height:1.6;

    max-width:340px;

    margin:auto;
}


/* =========================================================
   FORM
========================================================= */

.login-form{

    width:100%;
}


.form-group{

    margin-bottom:17px;
}


.form-label{

    display:block;

    margin-bottom:8px;

    font-size:12px;

    font-weight:600;

    color:
        var(--text);
}


.input-wrapper{

    position:relative;
}


.input-icon{

    position:absolute;

    left:15px;
    top:50%;

    transform:
        translateY(-50%);

    color:
        var(--text-soft);

    font-size:16px;

    pointer-events:none;

    transition:var(--transition);
}


html[dir="rtl"] .input-icon{

    left:auto;

    right:15px;
}


.form-input{

    width:100%;

    height:50px;

    border:
        1px solid var(--border);

    border-radius:14px;

    outline:none;

    background:
        var(--surface-soft);

    color:
        var(--text);

    padding:
        0 44px;

    font-family:inherit;

    font-size:13px;

    transition:var(--transition);
}


.form-input::placeholder{

    color:#9AA1B3;
}


.form-input:focus{

    border-color:
        var(--secondary);

    background:
        var(--surface);

    box-shadow:
        0 0 0 4px
        rgba(115,87,232,.09);
}


.form-input:focus + .input-icon{

    color:
        var(--secondary);
}


/* =========================================================
   PASSWORD BUTTON
========================================================= */

.password-toggle{

    position:absolute;

    right:14px;
    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:
        transparent;

    color:
        var(--text-soft);

    cursor:pointer;

    font-size:17px;

    padding:4px;
}


html[dir="rtl"] .password-toggle{

    right:auto;

    left:14px;
}


.password-toggle:hover{

    color:
        var(--secondary);
}


/* =========================================================
   REMEMBER / FORGOT
========================================================= */

.form-options{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin:
        3px 0 20px;
}


.remember{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:11.5px;

    color:
        var(--text-soft);

    cursor:pointer;
}


.remember input{

    width:15px;
    height:15px;

    accent-color:
        var(--secondary);

    cursor:pointer;
}


.forgot{

    color:
        var(--primary);

    font-size:11.5px;

    font-weight:600;

    text-decoration:none;

    white-space:nowrap;
}


.forgot:hover{

    color:
        var(--secondary);
}


/* =========================================================
   PRIMARY LOGIN BUTTON
========================================================= */

.login-btn{

    width:100%;

    height:51px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    color:white;

    font-family:inherit;

    font-size:13px;

    font-weight:700;

    letter-spacing:.2px;

    cursor:pointer;

    box-shadow:
        0 12px 25px
        rgba(74,73,183,.22);

    transition:var(--transition);

    position:relative;

    overflow:hidden;
}


.login-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transition:.6s;
}


.login-btn:hover::before{

    left:100%;
}


.login-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 17px 32px
        rgba(74,73,183,.30);
}


.login-btn:active{

    transform:
        translateY(0);
}


/* =========================================================
   DIVIDER
========================================================= */

.divider{

    display:flex;

    align-items:center;

    gap:12px;

    margin:
        23px 0 17px;

    color:
        var(--text-soft);

    font-size:10px;

    letter-spacing:.7px;

    text-transform:uppercase;
}


.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:
        var(--border);
}


/* =========================================================
   SOCIAL BUTTONS
========================================================= */

.social-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:11px;
}


.social-btn{

    height:46px;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:
        var(--surface);

    color:
        var(--text);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    font-family:inherit;

    font-size:12px;

    font-weight:600;

    cursor:pointer;

    transition:var(--transition);
}


.social-btn:hover{

    border-color:
        var(--secondary);

    background:
        var(--secondary-soft);

    transform:
        translateY(-2px);
}


.social-btn i{

    font-size:17px;
}


.social-google i{

    color:#4285F4;
}


.social-apple i{

    color:
        var(--text);
}


/* =========================================================
   SIGN UP
========================================================= */

.signup-line{

    text-align:center;

    margin-top:22px;

    font-size:12px;

    color:
        var(--text-soft);
}


.signup-line a{

    color:
        var(--primary);

    font-weight:700;

    text-decoration:none;

    margin-left:4px;
}


.signup-line a:hover{

    color:
        var(--secondary);
}


/* =========================================================
   RTL
========================================================= */

html[dir="rtl"] .form-label{

    text-align:right;
}


html[dir="rtl"] .form-options{

    direction:rtl;
}


html[dir="rtl"] .signup-line{

    direction:rtl;
}


/* =========================================================
   TABLET
========================================================= */

@media (min-width:600px) and (max-width:850px){

    .auth-page{

        padding:24px;
    }

    .login-card{

        width:min(100%,540px);

        min-height:760px;

        padding:
            44px 52px;
    }

    .logo-box{

        width:72px;
        height:72px;
    }

    .brand-name{

        font-size:29px;
    }

    .login-intro h1{

        font-size:38px;
    }

    .form-input{

        height:53px;
    }

    .login-btn{

        height:54px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:480px){

    .auth-page{

        padding:15px;
    }


    .top-controls{

        top:12px;

        right:14px;

        gap:6px;
    }


    html[dir="rtl"] .top-controls{

        right:auto;

        left:14px;
    }


    .control-btn{

        width:36px;
        height:36px;

        border-radius:11px;

        font-size:15px;
    }


    .login-card{

        width:100%;

        min-height:0;

        height:auto;

        max-height:
            calc(100svh - 30px);

        padding:
            27px 24px 25px;

        border-radius:24px;

        justify-content:flex-start;

        overflow:hidden;
    }


    .brand{

        margin-bottom:19px;

        gap:10px;
    }


    .logo-box{

        width:52px;
        height:52px;

        border-radius:15px;
    }

    }


    .brand-tag{

        letter-spacing:1.5px;
    }

        margin-bottom:19px;
    }

        font-size:9px;

        margin-bottom:6px;
    }


    .login-intro h1{

        margin-bottom:6px;
    }


    .login-intro p{

        font-size:12px;

        line-height:1.45;
    }

        margin-bottom:12px;
    }


    .form-label{

        font-size:12px;

        margin-bottom:6px;
    }


    .form-input{

        height:44px;

        border-radius:12px;

        font-size:12px;

        padding-left:40px;

        padding-right:40px;
    }


    html[dir="rtl"] .form-input{

        padding-left:40px;

        padding-right:40px;
    }


    .input-icon{

        left:13px;

        font-size:16px;
    }


    html[dir="rtl"] .input-icon{

        left:auto;

        right:13px;
    }


    .password-toggle{

        right:11px;

        font-size:17px;
    }


    html[dir="rtl"] .password-toggle{

        right:auto;

        left:11px;
    }


    .form-options{

        margin:
            2px 0 14px;
    }


    .remember,
    .forgot{

        font-size:11.5px;
    }


    .login-btn{

        height:45px;

        border-radius:12px;

        font-size:13px;
    }


    .divider{

        margin:
            17px 0 12px;

        font-size:9px;
    }


    .social-grid{

        gap:8px;
    }


    .social-btn{

        height:40px;

        border-radius:11px;

        font-size:11px;
    }


    .signup-line{

        margin-top:15px;

        font-size:11.5px;
    }

}


/* =========================================================
   SHORT MOBILE
========================================================= */

@media (max-width:480px) and (max-height:760px){

    .login-card{

        padding-top:22px;

        padding-bottom:20px;
    }


    .brand{

        margin-bottom:14px;
    }


    .logo-box{

        width:48px;
        height:48px;
    }


    .brand-name{

        font-size:20px;
    }


    .login-intro{

    }


    .login-intro h1{

        font-size:25px;
    }


    .login-intro p{

        font-size:10px;
    }

        margin-bottom:9px;
    }


    .form-input{

        height:41px;
    }


    .login-btn{

        height:42px;
    }


    .divider{

        margin:
            13px 0 10px;
    }


    .social-btn{

        height:37px;
    }

        margin-top:12px;
    }

/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width:360px){

    .auth-page{

        padding:10px;
    }


    .top-controls{

        top:9px;

        right:10px;
    }


    html[dir="rtl"] .top-controls{

        right:auto;

        left:10px;
    }


    .control-btn{

        width:33px;
        height:33px;

        font-size:13px;
    }


    .login-card{

        padding:
            20px 19px 18px;

        border-radius:21px;
    }


    .brand{

        margin-bottom:12px;
    }


    .logo-box{

        width:44px;
        height:44px;
    }


    .brand-name{

        font-size:19px;
    }


    .brand-tag{

        font-size:7px;
    }


    .login-intro h1{

        font-size:23px;
    }


    .login-intro p{

        font-size:9.5px;
    }


    .form-input{

        height:39px;

        font-size:10.5px;
    }


    .login-btn{

        height:40px;
    }


    .social-btn{

        height:35px;

        font-size:9px;
    }

}


/* =========================================================
   NEST HUB / SHORT DESKTOP
   1024 × 600
========================================================= */

@media (min-width:850px) and (max-height:700px){

    .auth-page{

        padding:18px;

        height:100svh;
    }


    .top-controls{

        top:14px;

        right:18px;
    }


    html[dir="rtl"] .top-controls{

        right:auto;

        left:18px;
    }


    .login-card{

        width:480px;

        min-height:0;

        height:
            calc(100svh - 36px);

        max-height:570px;

        padding:
            25px 43px;

        justify-content:flex-start;

        overflow:hidden;
    }


    .brand{

        margin-bottom:14px;
    }


    .logo-box{

        width:50px;
        height:50px;
    }


    .brand-name{

        font-size:24px;
    }


    .brand-tag{

        font-size:8px;
    }


    .login-intro{

        margin-bottom:15px;
    }


    .login-intro h1{

        font-size:29px;
    }


    .login-intro p{

        font-size:12px;
    }


    .form-group{

        margin-bottom:9px;
    }


    .form-label{

        font-size:11px;

        margin-bottom:5px;
    }


    .form-input{

        height:40px;

        font-size:12px;
    }


    .login-btn{

        height:42px;
    }


    .divider{

        margin:
            13px 0 10px;
    }


    .social-btn{

        height:37px;
    }


    .signup-line{

        margin-top:12px;
    }

}


/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media (max-height:500px) and (orientation:landscape){

    .auth-page{

        padding:10px;
    }


    .top-controls{

        top:8px;

        right:10px;
    }


    html[dir="rtl"] .top-controls{

        right:auto;

        left:10px;
    }


    .login-card{

        min-height:0;

        height:
            calc(100svh - 20px);

        max-height:none;

        padding:
            14px 30px;

        justify-content:flex-start;

        overflow:hidden;

        border-radius:20px;
    }


    .brand{

        margin-bottom:8px;
    }


    .logo-box{

        width:36px;
        height:36px;
    }


    .brand-name{

        font-size:17px;
    }


    .brand-tag{

        font-size:6px;
    }


    .login-intro{

        margin-bottom:8px;
    }


    .login-intro .eyebrow{

        display:none;
    }


    .login-intro h1{

        font-size:20px;

        margin-bottom:3px;
    }


    .login-intro p{

        display:none;
    }


    .form-group{

        margin-bottom:6px;
    }


    .form-label{

        display:none;
    }


    .form-input{

        height:32px;
    }


    .form-options{

        margin:
            2px 0 7px;
    }


    .login-btn{

        height:34px;
    }


    .divider{

        margin:
            7px 0 6px;
    }


    .social-btn{

        height:30px;
    }


    .signup-line{

        margin-top:6px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

</style>

</head>


<body>


<main class="auth-page">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="auth-bg"></div>

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>


    <!-- =====================================================
         TOP CONTROLS
    ====================================================== -->

    <div class="top-controls">


        <!-- RTL -->

        <button
            class="control-btn"
            id="directionBtn"
            type="button"
            aria-label="Change direction">

            <i class="bi bi-arrow-left-right"></i>

        </button>


        <!-- DARK / LIGHT -->

        <button
            class="control-btn"
            id="themeBtn"
            type="button"
            aria-label="Toggle dark mode">

            <i class="bi bi-moon"></i>

        </button>

    </div>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <section class="login-card">


        <!-- =================================================
             ASTRA VISTA BRAND
        ================================================== -->

        <a
            href="index.html"
            class="brand">


            <div class="logo-box image-logo">

                <img
                    src="images/logo.png"
                    alt="AstraVista">

            </div>


            <div class="brand-text">


                <span class="brand-name">

                    <span class="brand-primary">
                        Astra
                    </span>

                    <span class="brand-secondary">
                        Vista
                    </span>

                </span>


                <span class="brand-tag">
                    ASTRONOMY
                </span>


            </div>


        </a>


        <!-- =================================================
             INTRO
        ================================================== -->

        <div class="login-intro">


            <div class="eyebrow">

                <span class="eyebrow-line"></span>

                MEMBER ACCESS

                <span class="eyebrow-line"></span>

            </div>


            <h1>
                Welcome Back
            </h1>


            <p>
                Sign in to continue your journey
                through the universe with AstraVista.
            </p>


        </div>


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
            class="login-form"
            id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">


                <label
                    class="form-label"
                    for="email">

                    Email Address

                </label>


                <div class="input-wrapper">


                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>


                    <i
                        class="bi bi-envelope input-icon">
                    </i>


                </div>


            </div>


            <!-- PASSWORD -->

            <div class="form-group">


                <label
                    class="form-label"
                    for="password">

                    Password

                </label>


                <div class="input-wrapper">


                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                    <i
                        class="bi bi-lock input-icon">
                    </i>


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password">

                        <i class="bi bi-eye"></i>

                    </button>


                </div>


            </div>


            <!-- =================================================
                 REMEMBER / FORGOT
            ================================================== -->

            <div class="form-options">


                <label class="remember">


                    <input
                        type="checkbox"
                        id="remember">


                    <span>
                        Remember Me
                    </span>


                </label>


                <a
                    href="forgot-password.html"
                    class="forgot">

                    Forgot Password?

                </a>


            </div>


            <!-- =================================================
                 LOGIN
            ================================================== -->

            <button
                type="submit"
                class="login-btn">

                Sign In

            </button>


            <!-- =================================================
                 DIVIDER
            ================================================== -->

            <div class="divider">

                <span>
                    Or continue with
                </span>

            </div>


            <!-- =================================================
                 SOCIAL LOGIN
            ================================================== -->

            <div class="social-grid">


                <button
                    type="button"
                    class="social-btn social-google"
                    id="googleBtn">


                    <i class="bi bi-google"></i>


                    <span>
                        Google
                    </span>


                </button>


                <button
                    type="button"
                    class="social-btn social-apple"
                    id="appleBtn">


                    <i class="bi bi-apple"></i>


                    <span>
                        Apple
                    </span>


                </button>


            </div>


            <!-- =================================================
                 SIGN UP
            ================================================== -->

            <div class="signup-line">


                <span>
                    Don't have an account?
                </span>


                <a href="signup.html">
                    Create Account
                </a>


            </div>


        </form>


    </section>


</main>
<script>
document.addEventListener("DOMContentLoaded", function () {

    "use strict";

    const html = document.documentElement;

    const themeBtn =
        document.getElementById("themeBtn");

    const directionBtn =
        document.getElementById("directionBtn");


    /* =========================================================
       THEME
    ========================================================= */

    let theme =
        localStorage.getItem("astravista-theme") || "light";


    function applyTheme() {

        html.classList.toggle(
            "dark",
            theme === "dark"
        );

        if (!themeBtn) return;

        /* Bootstrap Icons — always visible */
        themeBtn.innerHTML =
            theme === "dark"
                ? '<i class="bi bi-sun"></i>'
                : '<i class="bi bi-moon"></i>';

        themeBtn.setAttribute(
            "aria-label",
            theme === "dark"
                ? "Switch to light mode"
                : "Switch to dark mode"
        );

        themeBtn.title =
            theme === "dark"
                ? "Light mode"
                : "Dark mode";
    }


    applyTheme();


    if (themeBtn) {

        themeBtn.addEventListener(
            "click",
            function () {

                theme =
                    html.classList.contains("dark")
                        ? "light"
                        : "dark";

                localStorage.setItem(
                    "astravista-theme",
                    theme
                );

                applyTheme();

            }
        );

    }


    /* =========================================================
       RTL / LTR
    ========================================================= */

    let direction =
        localStorage.getItem("astravista-direction") || "ltr";


    function applyDirection() {

        html.setAttribute(
            "dir",
            direction
        );

        if (!directionBtn) return;

        directionBtn.innerHTML =
            '<i class="bi bi-arrow-left-right"></i>';

        directionBtn.setAttribute(
            "aria-label",
            direction === "ltr"
                ? "Switch to RTL"
                : "Switch to LTR"
        );

        directionBtn.title =
            direction === "ltr"
                ? "Switch to RTL"
                : "Switch to LTR";
    }


    applyDirection();


    if (directionBtn) {

        directionBtn.addEventListener(
            "click",
            function () {

                direction =
                    direction === "ltr"
                        ? "rtl"
                        : "ltr";

                localStorage.setItem(
                    "astravista-direction",
                    direction
                );

                applyDirection();

            }
        );

    }

});
</script>
<script>
lucide.createIcons();
</script>
</body>

</html>
